<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Monopoly Banker</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1b2e;
    --panel:rgba(255,255,255,.06); --panel-solid:#132238;
    --line:rgba(255,255,255,.10);
    --txt:#eaf1fb; --muted:#93a4bf;
    --gold:#f4c542; --gold2:#e0a92e; --accent-ink:#3a2a00;
    --glow:#1a3355; --glow2:#112233;
    --green:#2ecc71; --green2:#1f9d57;
    --red:#ff5d6c; --red2:#e0384a;
    --blue:#4aa3ff;
    --shadow:0 12px 40px rgba(0,0,0,.45);
    --r:22px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Kanit",system-ui,sans-serif;
    background:
      radial-gradient(1200px 700px at 80% -10%, var(--glow) 0%, transparent 60%),
      radial-gradient(900px 600px at -10% 110%, var(--glow2) 0%, transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    transition:background .4s;
    color:var(--txt); min-height:100dvh;
    -webkit-user-select:none; user-select:none;
    overflow-x:hidden;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:58px 58px calc(58px + var(--safe-b))}

  /* ---------- screen rotator (device in center of table) ---------- */
  #rotor{position:fixed;top:50%;left:50%;width:100vw;height:100dvh;
    transform:translate(-50%,-50%) rotate(0deg);transform-origin:center center;
    transition:transform .5s cubic-bezier(.45,.05,.15,1);
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #sideBtns .side-btn{position:fixed;z-index:35;width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;font-size:16px;font-weight:900;color:var(--muted);
    background:rgba(15,27,46,.9);border:1px solid var(--line);backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.45);transition:background .15s,color .15s}
  #sideBtns .side-btn:active{opacity:.6}
  #sideBtns{transition:opacity .15s}
  body.sheet-open #sideBtns,body.sheet-open #endTurn{opacity:0;pointer-events:none}
  #sideBtns .side-btn.on{color:var(--accent-ink);background:linear-gradient(145deg,var(--gold),var(--gold2));border-color:transparent}
  .sb-top{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
  .sb-bottom{bottom:calc(8px + var(--safe-b));left:50%;transform:translateX(-50%)}
  .sb-left{left:8px;top:50%;transform:translateY(-50%)}
  .sb-right{right:8px;top:50%;transform:translateY(-50%)}
  #endTurn{position:fixed;z-index:35;left:50%;bottom:calc(62px + var(--safe-b));transform:translateX(-50%);
    min-width:240px;height:80px;padding:0 32px;border-radius:22px;font-size:22px;font-weight:900;
    color:var(--accent-ink);background:linear-gradient(145deg,var(--gold),var(--gold2));
    border:1px solid color-mix(in srgb,var(--gold) 70%, white);box-shadow:0 8px 24px rgba(0,0,0,.42);transition:opacity .15s,transform .08s}
  #endTurn:active{transform:translateX(-50%) scale(.96)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}

  /* ---------- App bar ---------- */
  .bar{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
  .logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--gold),var(--gold2));
    display:grid;place-items:center;color:var(--accent-ink);font-size:20px;box-shadow:0 6px 18px rgba(244,197,66,.35)}
  .logo b{font-size:19px}
  .logo small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px}
  .logo-img{height:42px;width:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
  .logo-txt b{font-size:26px;line-height:1}
  .logo-txt small{margin-top:2px}

  /* hide scrollbars everywhere (still scrollable) */
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0;height:0;display:none}
  .bar .sp{flex:1}
  .icobtn{width:44px;height:44px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
    display:grid;place-items:center;font-size:19px}
  .icobtn:active{transform:scale(.94)}

  /* ---------- Cards / generic ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .section-title{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:22px 4px 10px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:15px 18px;border-radius:16px;font-weight:800;font-size:16px;
    background:var(--panel);border:1px solid var(--line);transition:transform .06s}
  .btn:active{transform:scale(.97)}
  .btn.gold{background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--accent-ink);border:none;box-shadow:0 8px 22px rgba(244,197,66,.32)}
  .btn.green{background:linear-gradient(145deg,var(--green),var(--green2));color:#03270f;border:none}
  .btn.red{background:linear-gradient(145deg,var(--red),var(--red2));color:#fff;border:none}
  .btn.block{width:100%}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4}

  input,select{font-family:inherit;font-size:16px;color:var(--txt);background:#0c1626;border:1px solid var(--line);
    border-radius:14px;padding:14px;width:100%;outline:none}
  input:focus,select:focus{border-color:var(--gold)}
  label.fld{display:block;margin:14px 0}
  label.fld > span{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:0 2px 7px}

  .row{display:flex;gap:10px}
  .row.wrap{flex-wrap:wrap}
  .setup-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
  .setup-actions .btn{min-width:0;height:64px}

  /* ---------- Setup: player rows ---------- */
  #playerList{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #addPlayer{margin-top:10px}
  .p-row{display:flex;align-items:center;gap:8px;padding:9px;border-radius:16px;background:#0c1626;border:1px solid var(--line)}
  .tok{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
  .p-row .tok{width:44px;height:44px;font-size:22px}
  .p-row input.nm{flex:1;min-width:0;background:transparent;border:none;padding:8px 2px;font-weight:700;font-size:15px}
  .p-row input.pmoney{width:132px;flex:none;text-align:right;font-weight:800}
  .p-row .mini{width:34px;height:34px;font-size:15px}
  .p-row .dir{color:var(--gold);font-size:18px}
  .money-setting{display:flex;align-items:center;gap:10px}
  .money-setting input{flex:1}
  .icon-toggle{width:58px;height:50px;flex:none;border-radius:15px;background:#0c1626;border:1px solid var(--line);font-size:22px}
  .icon-toggle.on{background:var(--gold);color:var(--accent-ink);border-color:var(--gold)}

  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
  .theme-sw{padding:12px 6px 10px;border-radius:15px;background:#0c1626;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);transition:.12s}
  .theme-sw:active{transform:scale(.95)}
  .theme-sw .dot{width:36px;height:36px;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,.45)}
  .theme-sw.on{border-color:var(--gold);color:var(--txt);background:rgba(255,255,255,.05)}
  .p-row .pin{width:96px;text-align:center;letter-spacing:3px}
  .mini{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
  .mini.del{color:var(--red)}

  .swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
  .sw.on{border-color:#fff;transform:scale(1.08)}
  .toks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .tk{width:44px;height:44px;border-radius:12px;background:#0c1626;border:1px solid var(--line);display:grid;place-items:center;font-size:24px}
  .tk.on{border-color:var(--gold);background:rgba(244,197,66,.14)}

  .bonus-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .bonus-edit input.bl{flex:1}
  .bonus-edit input.ba{width:120px;text-align:right}

  /* ---------- Game board ---------- */
  .bank{position:relative;overflow:hidden;padding:20px;border-radius:26px;margin-bottom:6px;
    background:
      radial-gradient(500px 220px at 100% 0%, color-mix(in srgb, var(--gold) 26%, transparent), transparent 60%),
      linear-gradient(160deg, color-mix(in srgb, var(--gold) 13%, var(--bg2)), var(--bg2));
    border:1px solid color-mix(in srgb, var(--gold) 34%, transparent)}
  .bank h2{margin:0 0 2px;font-size:19px;display:flex;align-items:center;gap:9px}
  .bank .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .bank-btn{padding:15px 12px;border-radius:16px;font-weight:800;text-align:center;border:1px solid var(--line);
    background:rgba(255,255,255,.06);display:flex;flex-direction:column;gap:3px;height:128px;min-height:128px;justify-content:center}
  .bank-btn:active{transform:scale(.97)}
  .bank-btn.salary{background:linear-gradient(145deg,var(--green),var(--green2));color:#03270f;border:none}
  .bank-btn b{font-size:22px}
  .bank-btn small{font-size:16px;opacity:.85;font-weight:800}
  .bank-btn.gold{background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--accent-ink);border:none}

  .pool{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:16px;
    background:rgba(0,0,0,.22);border:1px solid var(--line)}
  .pool .ic{font-size:26px}
  .pool .t{flex:1}
  .pool .t b{font-size:15px}
  .pool .t div{font-size:12px;color:var(--muted)}
  .pool .amt{font-size:22px;font-weight:900;color:var(--gold)}

  .players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pcard{position:relative;height:180px;padding:16px;display:grid;grid-template-columns:92px minmax(0,1fr) 52px auto;
    align-items:center;gap:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
  .pcard:active{transform:scale(.98)}
  .pcard.active-facing{border:3px solid var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent),0 0 28px color-mix(in srgb,var(--gold) 55%,transparent)}
  .pcard.active-facing::after{content:"🎲";position:absolute;top:8px;right:10px;z-index:3;color:var(--gold);font-size:24px;
    filter:drop-shadow(0 0 7px var(--gold));animation:facingPulse 1.2s ease-in-out infinite alternate}
  @keyframes facingPulse{to{transform:scale(1.25);opacity:.65}}
  .pcard .player-icon{width:108px;align-self:stretch;margin:-16px 0 -16px -16px;display:grid;place-items:center;
    position:relative;border-right:1px solid var(--line);font-size:48px}
  .pcard .player-icon.jailed::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(90deg,transparent 0 17px,rgba(225,232,242,.9) 17px 23px),
      repeating-linear-gradient(0deg,transparent 0 36px,rgba(225,232,242,.9) 36px 42px);
    box-shadow:inset 0 0 0 5px rgba(225,232,242,.92)}
  .pcard .player-name{min-width:0;font-weight:900;font-size:clamp(20px,2.8vw,30px);line-height:1.1;letter-spacing:.3px;overflow-wrap:anywhere}
  .pcard .jail-count{display:grid;place-items:center;font-size:42px;font-weight:950;color:var(--gold)}
  .pcard .st{font-size:11.5px;color:var(--muted);font-weight:700}
  .pcard .bal{margin:0;display:flex;align-items:center;justify-content:flex-end;text-align:right;white-space:nowrap;font-size:clamp(20px,2.5vw,28px);font-weight:900;letter-spacing:.5px}
  .pcard .bal .m{font-size:13px;color:var(--muted);font-weight:800;margin-left:3px}
  .pcard .bal.hidden{color:var(--muted);letter-spacing:4px}
  .jail-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
  .jail-options .btn{height:128px;min-height:128px;padding:12px;font-size:18px}
  .dir-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
  .dir-grid .btn{height:112px;font-size:20px}
  .dir-grid .btn.on{background:var(--gold);color:var(--accent-ink);border-color:var(--gold)}
  .lock{position:absolute;top:12px;right:12px;font-size:14px;opacity:.6}

  /* ---------- Modal / sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(3,7,15,.62);backdrop-filter:blur(6px);z-index:40;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
    opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:relative;width:100%;max-width:520px;background:linear-gradient(180deg,#12203a,#0d182b);
    border:1px solid var(--line);border-radius:24px;
    box-shadow:0 24px 70px rgba(0,0,0,.6);padding:10px 18px 20px;
    transform:scale(.94);transition:transform .2s;max-height:88dvh;overflow:auto}
  .scrim.on .sheet{transform:none}
  .grip{width:44px;height:5px;border-radius:5px;background:#33465f;margin:6px auto 12px}
  .sheet-close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);
    font-size:15px;font-weight:900;display:grid;place-items:center;z-index:3}
  .sheet-close:active{opacity:.55;transform:scale(.92)}
  .sheet h3{margin:2px 0 4px;font-size:20px;display:flex;align-items:center;gap:10px;padding-right:48px;min-height:44px}
  .sheet .hint{color:var(--muted);font-size:13px;margin-bottom:14px}
  .sheet .confirm-msg-large{margin:16px 0 24px;color:var(--txt);font-size:28px;line-height:1.4;font-weight:900;text-align:center}
  .sheet .btn{min-height:62px;padding:18px 20px;font-size:17px;border-radius:18px}

  /* amount builder */
  .amt-box{text-align:center;padding:14px;border-radius:18px;background:#0b1425;border:1px solid var(--line);margin-bottom:12px}
  .amt-box .big{font-size:40px;font-weight:900;letter-spacing:1px}
  .amt-box .big .m{font-size:18px;color:var(--gold);margin-left:4px}
  .amt-box .who{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px;min-height:16px}
  .amount-input-wrap{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
  .amount-input{width:min(280px,80%);padding:2px 6px;border:0;border-bottom:2px solid var(--line);border-radius:0;
    background:transparent;text-align:center;font-size:40px;font-weight:900;color:var(--txt)}
  .amount-input:focus{border-color:var(--gold)}
  .amount-input-wrap .m{font-size:18px;color:var(--gold);font-weight:900}
  .amount-all-players{width:46px;height:46px;flex:none;border-radius:14px;background:#10203a;border:1px solid var(--line);
    color:var(--muted);font-size:22px;font-weight:900;display:grid;place-items:center}
  .amount-all-players.on{background:var(--gold);color:var(--accent-ink);border-color:var(--gold)}
  .amount-all-players:active{transform:scale(.94)}
  .amount-clear{width:46px;height:46px;flex:none;border-radius:14px;background:#10203a;border:1px solid var(--line);
    color:var(--muted);font-size:23px;font-weight:900;display:grid;place-items:center}
  .amount-clear:active{transform:scale(.94);color:var(--txt);background:rgba(244,197,66,.18)}
  .num-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .num-key{height:64px;border-radius:16px;background:#10203a;border:1px solid var(--line);font-size:22px;font-weight:900}
  .num-key:active{transform:scale(.96);background:rgba(244,197,66,.18)}
  .num-key[data-n="0"]{grid-column:2}

  .seg{display:flex;gap:8px;margin:6px 0 4px}
  .seg button{flex:1;min-height:58px;padding:15px 10px;border-radius:16px;font-weight:800;background:#0c1626;border:1px solid var(--line);font-size:15px}
  .seg button.on{background:var(--gold);color:var(--accent-ink);border-color:var(--gold)}
  .seg button,#amtMax,#amtOk{height:128px;min-height:128px}

  .pick-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .pick{display:flex;align-items:center;min-height:64px;gap:12px;padding:12px;border-radius:15px;background:#0c1626;border:1px solid var(--line)}
  .pick.on{border-color:var(--gold);background:rgba(244,197,66,.1)}
  .pick .tok{width:40px;height:40px;font-size:21px}
  .pick .nm{font-weight:800;flex:1}
  .pick .tick{color:var(--gold);font-size:18px;opacity:0}
  .pick.on .tick{opacity:1}
  #playerPick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  #playerPick .pick{min-width:0;height:96px;min-height:96px;gap:14px;padding:0;overflow:hidden}
  #playerPick .pick .tok{width:80px;height:96px;align-self:stretch;border-radius:14px 0 0 14px;font-size:34px}
  #playerPick .pick .nm{min-width:0;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
  #playerPick .pick .tick{padding-right:12px;font-size:17px}
  #ppList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #ppList .pick{height:128px;min-height:128px;min-width:0;padding:0;gap:16px;overflow:hidden}
  #ppList .pick .tok{width:92px;height:128px;align-self:stretch;border-radius:14px 0 0 14px;font-size:42px}
  #ppList .pick .nm{min-width:0;padding-right:14px;font-size:22px;line-height:1.25;overflow-wrap:anywhere}

  /* pin pad */
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:10px 0 16px}
  .pin-dots i{width:15px;height:15px;border-radius:50%;background:#28374d;transition:.15s}
  .pin-dots i.on{background:var(--gold);transform:scale(1.15)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{padding:18px;border-radius:16px;font-size:22px;font-weight:800;background:#0c1626;border:1px solid var(--line)}
  .pad button:active{background:rgba(244,197,66,.18)}
  .pad .wide{grid-column:span 1}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

  /* history */
  .hitem{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .hitem .hi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:#0c1626;border:1px solid var(--line)}
  .hitem .ht{flex:1;font-size:14px;font-weight:600}
  .hitem .ht small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
  .hitem .hv{font-weight:900}
  .hv.plus{color:var(--green)} .hv.minus{color:var(--red)}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    display:grid;place-items:center;min-width:min(420px,88vw);min-height:120px;
    background:#1a2b45;border:2px solid var(--line);color:var(--txt);padding:26px 32px;border-radius:24px;
    font-weight:900;font-size:24px;line-height:1.4;box-shadow:0 24px 70px rgba(0,0,0,.65);z-index:60;
    opacity:0;transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast.good{border-color:var(--green)} .toast.bad{border-color:var(--red)}

  .hidden{display:none !important}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .fab-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  #aRecv,#aPay,#aSalary,#aTax{height:128px;min-height:128px}
  #aJail{height:128px;min-height:128px;margin-top:18px}
  #poolCollect{height:128px;min-height:128px}
  #cfOk,#cfCancel{height:128px;min-height:128px}
  #mResume,#mReset,#mSetup,#mNew{height:128px;min-height:128px}
  .hr{height:1px;background:var(--line);margin:16px 0}

  /* ranking (end game) */
  .rank-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .rank-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:15px;background:#0c1626;border:1px solid var(--line)}
  .rank-item.win{border-color:var(--gold);background:rgba(244,197,66,.12)}
  .rank-item .rk{width:32px;text-align:center;font-size:20px;font-weight:900}
  .rank-item .tok{width:38px;height:38px;font-size:20px}
  .rank-item .rn{flex:1;font-weight:800}
  .rank-item .rv{font-weight:900;font-size:17px}
  .rank-item .rv small{color:var(--muted);font-weight:800;font-size:11px}

  /* ===== light (white) theme ===== */
  html.light{--txt:#1a2438;--muted:#5f6f88;--line:rgba(20,35,60,.14);
    --panel:rgba(30,55,100,.05);--panel-solid:#ffffff;--shadow:0 12px 34px rgba(40,60,100,.15)}
  html.light input,html.light select{background:#f3f6fb;color:var(--txt)}
  html.light .card,html.light .pcard{background:#ffffff}
  html.light .p-row,html.light .icon-toggle:not(.on),html.light .pad button,html.light .hitem .hi,html.light .rank-item,
  html.light .chip:not(.on),html.light .theme-sw:not(.on),html.light .seg button:not(.on),
  html.light .pick:not(.on),html.light .num-key,html.light .amount-clear,html.light .amount-all-players:not(.on){background:#eef3fb;border-color:var(--line)}
  html.light .amt-box{background:#eaf0f8;border-color:var(--line)}
  html.light .bank-btn:not(.salary):not(.gold){background:#eef3fb;border-color:var(--line)}
  html.light .btn:not(.gold):not(.green):not(.red):not(.ghost){background:#eef3fb;border-color:var(--line)}
  html.light .icobtn{background:#eef3fb}
  html.light .sheet{background:linear-gradient(180deg,#ffffff,#f1f5fb)}
  html.light .bank{background:linear-gradient(160deg,#e9f0fb,#dbe6f4);border-color:rgba(47,127,224,.32)}
  html.light .pool{background:rgba(20,40,80,.05)}
  html.light .toast{background:#ffffff;color:var(--txt)}
  html.light .grip{background:#c3ccd9}
  html.light .side-btn:not(.on){background:rgba(255,255,255,.92)}
  html.light .sheet-close{background:rgba(20,40,80,.06)}
  html.light .num-key:active{background:rgba(47,127,224,.16)}
  html.light .chip.on{background:rgba(47,127,224,.14)}
  html.light .pick.on{background:rgba(47,127,224,.10)}
  html.light .theme-sw.on{background:rgba(47,127,224,.08)}
  html.light .rank-item.win{background:rgba(47,127,224,.10)}

    .sheet{width:calc(100% - 12px);max-width:520px;max-height:95dvh;padding:8px 12px 14px;border-radius:19px}
    .sheet h3{font-size:18px;min-height:40px}
    .sheet-close{width:40px;height:40px;top:9px;right:9px}
    .sheet .btn{min-height:50px;padding:12px 10px;font-size:15px;border-radius:14px}
    .seg{gap:6px}
    .seg button{height:72px;min-height:72px;padding:8px 5px;font-size:13px}
    .amt-box{padding:10px;margin-bottom:8px}
    .amount-input{font-size:32px}
    .num-pad{gap:6px;margin:8px 0}
    .num-key{height:48px;font-size:19px;border-radius:12px}
    .seg button,#amtMax,#amtOk{height:68px;min-height:68px}
    #playerPick .pick{height:72px;min-height:72px;gap:8px}
    #playerPick .pick .tok{width:58px;height:72px;font-size:27px}
    #playerPick .pick .nm{font-size:16px}
    #ppList .pick{height:84px;min-height:84px;gap:10px}
    #ppList .pick .tok{width:68px;height:84px;font-size:32px}
    #ppList .pick .nm{font-size:18px}
    #aRecv,#aPay,#aSalary,#aTax{height:82px;min-height:82px}
    #aJail{height:82px;min-height:82px;margin-top:10px}

    #mResume,#mReset,#mSetup,#mNew{height:78px;min-height:78px}

    .jail-options .btn{height:84px;min-height:84px;font-size:15px}
    .dir-grid{gap:6px}
    .dir-grid .btn{height:72px;min-height:72px;font-size:16px}
    .sheet .confirm-msg-large{font-size:22px;margin:10px 0 16px}
    #endTurn{min-width:154px;height:54px;bottom:calc(58px + var(--safe-b));padding:0 18px;border-radius:16px;font-size:16px}
    .toast{min-width:min(320px,86vw);min-height:90px;padding:18px 22px;border-radius:20px;font-size:19px}
  }

  @media (max-width:600px) and (orientation:portrait){
    .players{grid-template-columns:1fr}
  }

<script>
"use strict";
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='monopoly_banker_v1';
const COLORS=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#ec407a'];
const TOKENS=['🎩','🚗','🐕','🐈','🚢','👢','🎁','👑','🦆','🐧','🗑️','💰','🚀','🎸','🐉','🦊'];
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* -------- default draft (setup) -------- */
function mkPlayer(name,i){return{id:uid(),name,color:COLORS[i%COLORS.length],token:TOKENS[i%TOKENS.length],pin:'',direction:null}}
function defaultDraft(){return{
  players:[
    mkPlayer('ผู้เล่น 1',0),mkPlayer('ผู้เล่น 2',1),
    mkPlayer('ผู้เล่น 3',2),mkPlayer('ผู้เล่น 4',3)
  ],
  startMoney:1500,salary:200,theme:'gold',equalStartMoney:true,defaultPayTarget:'bank',
  bonuses:[
    {label:'เก็บภาษี',amount:-100},
    {label:'รับรางวัล',amount:100},
    {label:'เสียเงิน',amount:-50},
    {label:'เสียเงิน',amount:-100},
    {label:'เสียเงิน',amount:-150}
  ]
}}
let draft=load('draft')||defaultDraft();

/* -------- game state -------- */
let game=load('game')||null;

if(typeof draft.equalStartMoney!=='boolean')draft.equalStartMoney=true;
if(!['bank','pool'].includes(draft.defaultPayTarget))draft.defaultPayTarget='bank';

// migrate the original tax preset from 200 M to the new 100 M default
[draft.bonuses,game?.bonuses].forEach(list=>list?.forEach(b=>{
  if(b.label.trim()==='เก็บภาษี'&&b.amount===-200)b.amount=-100;
}));

function save(){localStorage.setItem(LS,JSON.stringify({draft,game}))}
function load(k){try{const d=JSON.parse(localStorage.getItem(LS));return d?d[k]:null}catch(e){return null}}

/* ================= TOAST ================= */
let toastT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast on '+(kind||'');
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast '+(kind||''),1900)}

/* ================= THEMES ================= */
const THEMES={
  gold:  {name:'ทองคลาสสิก', gold:'#f4c542', gold2:'#e0a92e', ink:'#3a2a00', glow:'#4a3512', glow2:'#241a0a', bg:'#100d07', bg2:'#1b140b'},
  light: {name:'ขาวสว่าง', gold:'#2f7fe0', gold2:'#1f63c4', ink:'#ffffff', glow:'#dbe7fb', glow2:'#eef3fb', bg:'#eef2f8', bg2:'#e2e8f2', light:true},
  ocean: {name:'ฟ้ามหาสมุทร', gold:'#4aa3ff', gold2:'#2f7fe0', ink:'#04213f', glow:'#12345f', glow2:'#0e2038', bg:'#0a1120', bg2:'#0d1a2e'},
  emerald:{name:'เขียวมรกต', gold:'#33d17a', gold2:'#1f9d57', ink:'#042312', glow:'#14432f', glow2:'#0e2820', bg:'#0a1512', bg2:'#0d1f18'},
  royal: {name:'ม่วงราชวงศ์', gold:'#b18cff', gold2:'#8a5cf0', ink:'#1e0a3f', glow:'#331a5f', glow2:'#1f1238', bg:'#0f0b1a', bg2:'#160f2b'},

const THEME_SW={gold:'#f4c542',light:'#ffffff',ocean:'#4aa3ff',emerald:'#2ecc71',royal:'#b18cff',ruby:'#ff5d6c',sunset:'#ffa94d',candy:'#ff7eb6',teal:'#37d7d0'};
function applyTheme(key){
  const t=THEMES[key]||THEMES.gold;
  const s=document.documentElement.style;
  s.setProperty('--gold',t.gold); s.setProperty('--gold2',t.gold2);
  s.setProperty('--accent-ink',t.ink);
  s.setProperty('--glow',t.glow); s.setProperty('--glow2',t.glow2);
  s.setProperty('--bg',t.bg); s.setProperty('--bg2',t.bg2);
  document.documentElement.classList.toggle('light', !!t.light);
  draft.theme=THEMES[key]?key:'gold'; save();
  $$('#themeGrid .theme-sw').forEach(el=>el.classList.toggle('on',el.dataset.k===draft.theme));
}
function renderThemes(){
  const g=$('#themeGrid'); if(!g)return; g.innerHTML='';
  const cur=draft.theme||'gold';
  Object.entries(THEMES).forEach(([k,t])=>{
    const el=document.createElement('button');
    el.className='theme-sw'+(k===cur?' on':''); el.dataset.k=k;
    el.innerHTML=`<span class="dot" style="background:${THEME_SW[k]||t.gold};border:2px solid rgba(120,130,150,.45)"></span>${t.name}`;
    el.onclick=()=>applyTheme(k);
    g.appendChild(el);
  });
}

/* ================= SETUP RENDER ================= */
function renderSetup(){

    if(p.startMoney==null)p.startMoney=draft.startMoney;
    row.innerHTML=`
      <button class="tok" data-tok style="background:${p.color}22;border:1px solid ${p.color}">${p.token}</button>
      <input class="nm" value="${esc(p.name)}" placeholder="ชื่อผู้เล่น" maxlength="14">
      ${draft.equalStartMoney?'':`<input class="pmoney" type="number" inputmode="numeric" min="0" value="${p.startMoney}" aria-label="เงินเริ่มต้นของ ${esc(p.name)}">`}
      <button class="mini dir" data-dir title="เลือกทิศทาง">${directionIcon(p.direction)}</button>
      <button class="mini del">🗑️</button>`;
    row.querySelector('.nm').oninput=e=>{p.name=e.target.value;save()};

    list.appendChild(row);
  });

  $('#startMoney').value=draft.startMoney;

    r.innerHTML=`
      <input class="bl" value="${esc(b.label)}" placeholder="ชื่อปุ่ม" maxlength="16">
      <input class="ba" value="${b.amount}" inputmode="numeric" placeholder="จำนวน">
      <button class="mini del">🗑️</button>`;

    r.querySelector('.ba').oninput=e=>{b.amount=parseInt(e.target.value||0,10)||0;save()};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function directionIcon(deg){return deg===0?'▼':deg===90?'◀':deg===180?'▲':deg===270?'▶':'◎'}
function directionName(deg){return deg===0?'ด้านล่าง':deg===90?'ด้านซ้าย':deg===180?'ด้านบน':deg===270?'ด้านขวา':'ยังไม่กำหนด'}

function editDirection(p){
  const choices=[{deg:180,icon:'▲',name:'ด้านบน'},{deg:90,icon:'◀',name:'ด้านซ้าย'},
    {deg:270,icon:'▶',name:'ด้านขวา'},{deg:0,icon:'▼',name:'ด้านล่าง'}];
  openSheet(`
    <h3>🧭 ทิศทางของ ${esc(p.name)}</h3>
    <div class="hint">เลือกตำแหน่งที่ผู้เล่นนั่งรอบหน้าจอ</div>
    <div class="dir-grid" id="dirGrid">

    </div>
  `);
  $('#dirGrid').onclick=e=>{
    const b=e.target.closest('[data-dir-value]');if(!b)return;
    const deg=parseInt(b.dataset.dirValue,10);
    draft.players.forEach(other=>{if(other.id!==p.id&&other.direction===deg)other.direction=null});
    p.direction=deg;save();closeSheet();renderSetup();toast('กำหนด '+directionName(deg)+' ให้ '+p.name,'good');
  };
}

/* ================= START GAME ================= */
function startGame(){
  draft.startMoney=parseInt($('#startMoney').value||0,10)||0;
  draft.salary=parseInt($('#salary').value||0,10)||0;
  const names=draft.players.map(p=>p.name.trim());
  if(names.some(n=>!n)){toast('กรุณาตั้งชื่อผู้เล่นให้ครบ','bad');return}

  game={
    players:draft.players.map(p=>{
      const initialBalance=draft.equalStartMoney?draft.startMoney:Math.max(0,parseInt(p.startMoney,10)||0);
      return {...p,name:p.name.trim(),balance:initialBalance,initialBalance};
    }),
    salary:draft.salary,
    bonuses:draft.bonuses.map(b=>({...b})),
    defaultPayTarget:draft.defaultPayTarget,
    pool:0,
    history:[],
    startMoney:draft.startMoney
  };
  save();showGame();
  toast(draft.equalStartMoney?'เริ่มเกม! ทุกคนได้ '+fmt(draft.startMoney)+' M':'เริ่มเกมด้วยยอดเงินที่กำหนดรายคนแล้ว','good');
}

/* ---- transfer flow: choose counterparty + amount ---- */
function transferFlow(mode,pid){
  // mode pay: p -> ?   ; recv: ? -> p
  const p=byId(pid);
  const others=game.players.filter(x=>x.id!==pid);
  const initialTarget=mode==='pay'&&game.defaultPayTarget==='pool'?'pool':'bank';
  let target=initialTarget; // 'bank' | 'pool' | player id
  const title = mode==='pay' ? `จ่ายเงินจาก ${p.name}` : `รับเงินเข้า ${p.name}`;
  const verb = mode==='pay' ? 'จ่ายให้' : 'รับจาก';

  openSheet(`
    <h3>${mode==='pay'?'⬆️':'⬇️'} ${esc(title)}</h3>
    <div class="hint">เลือก${verb}</div>
    <div class="seg" id="tgSeg">
      <button data-t="bank" class="${initialTarget==='bank'?'on':''}">🏛️ ธนาคาร</button>
      <button data-t="pool" class="${initialTarget==='pool'?'on':''}">🎁 กองโบนัส</button>
      <button data-t="player">👥 ผู้เล่น</button>
    </div>
    <div id="playerPick" class="pick-list hidden"></div>
    ${amountBuilderHTML()}
  `);

  const seg=$('#tgSeg');
  const pp=$('#playerPick');
  pp.innerHTML=(others.map(o=>`<div class="pick" data-id="${o.id}"><span class="tok" style="background:${o.color}22;border:1px solid ${o.color}">${o.token}</span><span class="nm">${esc(o.name)}</span><span class="tick">✓</span></div>`).join(''))
    || '<div class="empty">ไม่มีผู้เล่นอื่น</div>';
  const allBtn=$('#amtAllPlayers');
  allBtn.classList.remove('hidden');
  allBtn.onclick=()=>{
    target='all';
    $$('#tgSeg button').forEach(x=>x.classList.toggle('on',x.dataset.t==='player'));
    pp.classList.remove('hidden');
    $$('#playerPick .pick').forEach(x=>x.classList.remove('on'));
    allBtn.classList.add('on');updateWho();
  };
  seg.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;
    $$('#tgSeg button').forEach(x=>x.classList.toggle('on',x===b));
    const t=b.dataset.t;
    pp.classList.toggle('hidden',t!=='player');
    if(t==='player'){target=null} else target=t;
    allBtn.classList.remove('on');
    updateWho();
  };
  pp.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;target=b.dataset.id;
    $$('#playerPick .pick').forEach(x=>x.classList.toggle('on',x===b));allBtn.classList.remove('on');updateWho()};

  const A=setupAmount(()=>{
    if(mode==='pay') return byId(pid).balance;
    if(target==='pool') return game.pool;
    if(target && target!=='bank' && target!=='all') return byId(target) ? byId(target).balance : null;
    return null;
  });
  function updateWho(){
    let name = target==='bank'?'ธนาคาร':target==='pool'?'กองโบนัส':target==='all'?'ทุกคน (ผู้เล่นอื่น)':(target?byId(target)?.name:'— เลือกผู้เล่น —');
    $('#amtWho').textContent=(mode==='pay'?'จ่ายให้ ':'รับจาก ')+(name||'');
  }
  updateWho();

  $('#amtOk').textContent=mode==='pay'?'ยืนยันจ่าย':'ยืนยันรับ';
  $('#amtOk').onclick=()=>{
    const amt=A.value();
    if(amt<=0){toast('ใส่จำนวนเงินก่อน','bad');return}
    if(target===null){toast('เลือกผู้เล่นก่อน','bad');return}
    const max=A.max();
    if(max!=null && amt>max){toast('จำนวนเงินเกินยอดที่มี '+fmt(max)+' M','bad');return}
    if(target==='all'){
      if(mode==='pay'){
        const need=amt*others.length;
        if(byId(pid).balance<need){toast('เงินไม่พอจ่ายทุกคน (ต้องใช้ '+fmt(need)+' M)','bad');return}
        others.forEach(o=>doTransfer({type:'player',id:pid},{type:'player',id:o.id},amt,'จ่ายทุกคน'));
      }else{
        others.forEach(o=>doTransfer({type:'player',id:o.id},{type:'player',id:pid},amt,'รับจากทุกคน'));
      }
      toast('✅ '+(mode==='pay'?'จ่ายทุกคน':'รับจากทุกคน')+' คนละ '+fmt(amt)+' M','good');
      closeSheet();return;
    }
    const other = target==='bank'?'bank':target==='pool'?'pool':{type:'player',id:target};
    if(mode==='pay') doTransfer({type:'player',id:pid},other,amt,'โอนเงิน');
    else doTransfer(other,{type:'player',id:pid},amt,'โอนเงิน');
    closeSheet();
  };
}

function setupAmount(getMax){
  const input=$('#amtInput');
  $('#numPad').onclick=e=>{
    const key=e.target.closest('[data-n]');if(!key)return;
    const current=input.value==='0'?'':input.value;
    if(current.length>=12){toast('จำนวนเงินยาวเกินไป','bad');return}
    input.value=current+key.dataset.n;
  };
  const maxBtn=$('#amtMax');
  if(maxBtn) maxBtn.onclick=()=>{
    const m=getMax?getMax():null;
    if(m==null){toast('รายการนี้ไม่จำกัดจำนวน','bad');return}
    if(m<=0){toast('ไม่มียอดให้รับ','bad');return}
    input.value=Math.max(0,Math.round(m));
  };
  $('#amtClear').onclick=()=>{input.value='0'};
  return {
    value:()=>Math.round(Number(input.value)||0),
    set:v=>{input.value=Math.max(0,Math.round(Number(v)||0))},
    max:()=>getMax?getMax():null
  };
}

/* ================= CORE TRANSFER ================= */
// from/to: 'bank' | 'pool' | {type:'player',id}
function doTransfer(from,to,amount,note){
  amount=Math.round(amount);
  if(amount<=0)return;
  const fromP = from&&from.type==='player'?byId(from.id):null;
  const toP   = to&&to.type==='player'?byId(to.id):null;

  if(fromP && fromP.balance<amount){
    toast(fromP.name+' เงินไม่พอ (มี '+fmt(fromP.balance)+' M)','bad');return;
  }
  // apply
  if(fromP) fromP.balance-=amount;
  else if(from==='pool') game.pool=Math.max(0,game.pool-amount);
  if(toP) toP.balance+=amount;
  else if(to==='pool') game.pool+=amount;

  const label=(name(from))+' → '+(name(to));
  log(iconFor(from,to), label, note||'', amount, {from,to,amount});
  save();renderGame();
  toast('✅ '+label+'  '+fmt(amount)+' M','good');
}
function name(x){if(x==='bank')return'🏛️ ธนาคาร';if(x==='pool')return'🎁 กองโบนัส';return byId(x.id)?.name||'?'}
function iconFor(from,to){if(to&&to.type==='player'&&from==='bank')return'💵';if(from&&from.type==='player'&&to==='bank')return'🏛️';if(to==='pool'||from==='pool')return'🎁';return'🔁'}

/* history log */
function log(ic,text,note,amount,tx){
  game.history.unshift({ic,text,note,amount,tx,id:uid(),seq:game.history.length});
  if(game.history.length>200)game.history.pop();
}

function byId(id){return game.players.find(p=>p.id===id)}

/* ================= PIN ================= */
function askPin(p,onOk){
  let entered='';
  openSheet(`
    <h3>🔒 ใส่ PIN ของ ${esc(p.name)}</h3>
    <div class="hint">เพื่อดูยอดเงินและทำรายการ</div>
    <div class="pin-dots" id="pinDots">${[0,1,2,3].map(()=>'<i></i>').join('')}</div>
    <div class="pad" id="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}
      <button class="wide" data-x>⌫</button>
      <button data-n="0">0</button>
      <button class="wide" data-ok>✓</button>
    </div>
  `);
  const dots=$$('#pinDots i');
  const upd=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<entered.length));
  $('#pad').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.x!==undefined){entered=entered.slice(0,-1);upd();return}
    if(b.dataset.ok!==undefined){check();return}
    if(entered.length<4){entered+=b.dataset.n;upd();if(entered.length===4)setTimeout(check,120)}
  };
  function check(){
    if(entered===p.pin){onOk()}
    else{const s=$('#sheet');s.classList.add('shake');toast('PIN ไม่ถูกต้อง','bad');entered='';upd();setTimeout(()=>s.classList.remove('shake'),400)}
  }
}

/* ================= HISTORY SHEET ================= */
function historySheet(){
  const h=game?game.history:[];
  openSheet(`
    <h3>🧾 ประวัติรายการ</h3>
    <div style="margin:6px 0 4px">
      ${h.length?'<button class="btn ghost block" id="undo">↩️ ยกเลิกรายการล่าสุด</button>':''}
    </div>
    <div id="hlist">${h.length?h.map(x=>`
      <div class="hitem">
        <div class="hi">${x.ic}</div>
        <div class="ht">${esc(x.text)}<small>${esc(x.note||'')}</small></div>
        <div class="hv">${x.amount?fmt(x.amount)+' M':''}</div>
      </div>`).join(''):'<div class="empty">ยังไม่มีรายการ</div>'}</div>
  `);
  const u=$('#undo');if(u)u.onclick=undoLast;
}
function undoLast(){
  const last=game.history[0];
  if(!last){return}
  if(last.tx){ // reverse
    const {from,to,amount}=last.tx;
    const fromP=from&&from.type==='player'?byId(from.id):null;
    const toP=to&&to.type==='player'?byId(to.id):null;
    if(toP)toP.balance-=amount; else if(to==='pool')game.pool=Math.max(0,game.pool-amount);
    if(fromP)fromP.balance+=amount; else if(from==='pool')game.pool+=amount;
  }
  game.history.shift();save();renderGame();closeSheet();toast('ยกเลิกรายการแล้ว');
}

/* ================= END GAME: RESULTS ================= */
function endGameResults(){
  const ranked=game.players.slice().sort((a,b)=>b.balance-a.balance);
  const medals={1:'🥇',2:'🥈',3:'🥉'};
  let rank=0,prev=null;
  const rows=ranked.map((p,i)=>{
    if(prev===null||p.balance!==prev){rank=i+1;prev=p.balance}
    return {p,rank};
  });
  const champs=rows.filter(r=>r.rank===1).map(r=>r.p.name);
  const champText = champs.length>1 ? 'เสมอกันที่อันดับ 1 — '+champs.join(', ') : champs[0];
  openSheet(`
    <h3>🏆 ผลการแข่งขัน</h3>
    <div class="hint">ผู้ชนะคือ <b style="color:var(--gold)">${esc(champText)}</b> — อันดับตามเงินคงเหลือ</div>
    <div class="rank-list">
      ${rows.map(({p,rank})=>`
        <div class="rank-item${rank===1?' win':''}">
          <div class="rk">${medals[rank]||('#'+rank)}</div>
          <span class="tok" style="background:${p.color}22;border:1px solid ${p.color}">${p.token}</span>
          <div class="rn">${esc(p.name)}</div>
          <div class="rv">${fmt(p.balance)} <small>M</small></div>
        </div>`).join('')}
    </div>
    <button class="btn red block" id="egNew" style="margin-top:16px">🗑️ จบเกม & เริ่มใหม่</button>
    <button class="btn ghost block" id="egBack" style="margin-top:10px">เล่นต่อ</button>
  `);
  $('#egNew').onclick=()=>{game=null;save();closeSheet();showSetup();toast('เริ่มเกมใหม่ได้เลย')};
  $('#egBack').onclick=closeSheet;
}

let onClose=null;

  $('#sheet').innerHTML='<div class="grip"></div><button class="sheet-close" aria-label="ปิด">✕</button>'+html;
  $('#sheet').scrollTop=0;
  $('#sheet').querySelector('.sheet-close').onclick=closeSheet;

  document.body.classList.add('sheet-open');
  onClose=closeCb||null;
}
function closeSheet(){$('#scrim').classList.remove('on');document.body.classList.remove('sheet-open');if(onClose){onClose();onClose=null}}

/* ================= EVENTS ================= */
$('#addPlayer').onclick=()=>{if(draft.players.length>=12){toast('สูงสุด 12 คน','bad');return}
  const p=mkPlayer('ผู้เล่น '+(draft.players.length+1),draft.players.length);p.startMoney=draft.startMoney;

  if(draft.equalStartMoney)draft.players.forEach(p=>p.startMoney=draft.startMoney);save()};
$('#equalMoneyToggle').onclick=()=>{
  draft.equalStartMoney=!draft.equalStartMoney;
  if(!draft.equalStartMoney)draft.players.forEach(p=>p.startMoney=draft.startMoney);
  save();renderSetup();
};
$('#salary').oninput=e=>{draft.salary=parseInt(e.target.value||0,10)||0;save()};
$('#taxAmount').oninput=e=>{
  const amount=Math.max(1,parseInt(e.target.value||1,10)||1);
  let tax=draft.bonuses.find(b=>b.label.trim()==='เก็บภาษี');
  if(tax)tax.amount=-amount;
  else draft.bonuses.unshift({label:'เก็บภาษี',amount:-amount});
  save();
};
$('#defaultPayTarget').onchange=e=>{draft.defaultPayTarget=e.target.value==='pool'?'pool':'bank';save()};
$('#startGame').onclick=startGame;
$('#resumeGame').onclick=()=>{if(game)showGame()};

$('#btnDefaults').onclick=()=>confirmSheet({
  title:'คืนค่าเริ่มต้น?',
  ok:'คืนค่าเริ่มต้น',danger:true,
  onOk:()=>{draft=defaultDraft();applyTheme('gold');save();showSetup();toast('คืนค่าเริ่มต้นแล้ว','good')}
});

/* ================= SCREEN ROTATION ================= */
const rotor=$('#rotor');
let curRot=0;
function setRot(deg){
  curRot=deg;
  if(deg===90||deg===270){rotor.style.width='100dvh';rotor.style.height='100vw'}
  else{rotor.style.width='100vw';rotor.style.height='100dvh'}
  rotor.style.transform='translate(-50%,-50%) rotate('+deg+'deg)';
  $$('#sideBtns .side-btn').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.deg,10)===deg));
  if(game&&!$('#game').classList.contains('hidden'))renderGame();
}
$('#sideBtns').addEventListener('click',e=>{const b=e.target.closest('[data-deg]');if(!b)return;setRot(parseInt(b.dataset.deg,10))});
$('#endTurn').onclick=()=>setRot((curRot+90)%360);

/* ================= INIT ================= */
applyTheme(draft.theme||'gold');
renderSetup();
if(game) showGame();
})();
